[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a2a-codex-sandbox"
version = "0.1.0"
description = "Session-isolated A2A to ACP bridge runtime"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fake-acp-child = "a2a_codex_sandbox.fake_acp:main"

[project.optional-dependencies]
test = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_codex_sandbox"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
